name: routiq

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: routiq
      POSTGRES_PASSWORD: routiq
      POSTGRES_DB: routiq_dev
    ports:
      - "5435:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U routiq -d routiq_dev"]
      interval: 5s
      timeout: 3s
      retries: 10

  # S3-compatible storage for artifact uploads (§6a guard 2: S3 API only).
  # Same RustFS image, pinned by digest, as the artifacts test fixture. The
  # API creates the bucket at boot. Port 9000 is published because presigned
  # upload URLs are opened by the browser, not by the API.
  storage:
    image: rustfs/rustfs@sha256:8cc9801755448b71a786705ce76692c77e14936cccd87cf2fc31842e58f4d1ff
    profiles: ["appliance"]
    environment:
      # Demo defaults, like the postgres password: a real box supplies its own
      # pair from the deploy env file. The api service reads the same two
      # variables, so they cannot drift apart.
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY_ID:-appliance-demo-storage}
      RUSTFS_SECRET_KEY: ${S3_SECRET_ACCESS_KEY:-appliance-demo-storage-secret-change-me}
    ports:
      - "9000:9000"
    volumes:
      - storagedata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10

  # §6a guard 4: this file is the distribution artifact — the API must come up
  # cold from it. Dev workflow ignores this service (run `pnpm --filter dev`);
  # it is built/started by `docker compose --profile appliance up`.
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    profiles: ["appliance"]
    restart: unless-stopped
    environment:
      # Two roles, as in .env.example: request traffic runs as routiq_app so
      # tenant RLS applies; auth lookups and boot migrations need the owner.
      # Without AUTH_DATABASE_URL the API falls back to localhost:5435 and
      # exits at boot (#42).
      DATABASE_URL: postgres://routiq_app:routiq_app@postgres:5432/routiq_dev
      AUTH_DATABASE_URL: postgres://routiq:routiq@postgres:5432/routiq_dev
      PORT: 3001
      # Keys the fingerprint of command payloads (payload-fingerprint.ts); the
      # API will not start without it. This literal is a demo default, like the
      # postgres password above — a real box supplies its own from the deploy
      # env file, generated with `openssl rand -hex 32`.
      COMMAND_PAYLOAD_HMAC_KEY: ${COMMAND_PAYLOAD_HMAC_KEY:-appliance-demo-command-payload-hmac-key-change-me}
      # Artifact uploads (#88). Without S3_ENDPOINT the API registers no
      # upload routes. S3_ENDPOINT is how the API reaches storage inside the
      # compose network; S3_PUBLIC_ENDPOINT is the address the browser uses
      # for presigned uploads and downloads — set it to the box's own
      # host:9000 when the browser is not on this machine.
      S3_ENDPOINT: http://storage:9000
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
      S3_REGION: us-east-1
      S3_BUCKET: artifacts
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-appliance-demo-storage}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-appliance-demo-storage-secret-change-me}
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      storage:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3001/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6

  # TODO(web): served PWA joins the appliance profile once apps/web has a build
  # script (owned by the UI session).

volumes:
  pgdata:
    name: routiq_pgdata
  storagedata:
