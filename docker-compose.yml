services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: asset
      POSTGRES_PASSWORD: asset
      POSTGRES_DB: asset_dev
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U asset -d asset_dev"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
