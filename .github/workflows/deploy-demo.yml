# Deploys main to the demo box (deployment spec §3). Runs entirely on the
# self-hosted runner that lives on the box, so nothing here needs an inbound
# secret: checkout uses the job token, runtime config comes from an env file
# on the box that only the runner user can read.
name: Deploy demo

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      reseed:
        description: "Re-run the demo seed (transports-ngwa and littoral-voyages) after deploying"
        type: boolean
        default: false

# One deploy at a time, and never cancel one midway — a cancelled run can leave
# migrations applied with the old containers still serving.
concurrency:
  group: deploy-demo
  cancel-in-progress: false

permissions:
  contents: read

env:
  COMPOSE: docker compose -p routiq-demo -f docker-compose.demo.yml

jobs:
  deploy:
    # workflow_run also fires for failed CI runs; only a green one may reach the box.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: [self-hosted, demo]
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7
        with:
          # Deploy exactly the commit CI validated, not whatever main points at now.
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      # The web image cannot read git (.git is dockerignored), so the commit
      # reaches its version meta tag as a build arg (#601). Short, like a local
      # build's fallback. GITHUB_ENV keeps it for the rebuild in "Switch containers".
      - name: Stamp the app version
        run: echo "ROUTIQ_VERSION=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - name: Build images
        run: $COMPOSE build

      - name: Start database
        run: $COMPOSE up -d postgres

      # Before the switch, so a bad migration halts the deploy with the previous
      # containers still serving (spec §3 step 3). Runs inside the compose
      # network because Postgres is not reachable from the host.
      - name: Apply migrations
        run: $COMPOSE run --rm api pnpm db:migrate

      - name: Switch containers
        run: $COMPOSE up -d --build

      # The proxy network is not part of the compose file: it belongs to another
      # project on the box, and docker-compose.demo.yml has to stay bootable on
      # its own. Re-run every deploy because `up` recreates the container.
      - name: Attach web to the reverse-proxy network
        run: |
          set -euo pipefail
          network=$(grep -E '^PROXY_NETWORK=' /srv/routiq/demo.env | cut -d= -f2- || true)
          if [ -z "$network" ]; then
            echo "PROXY_NETWORK unset in /srv/routiq/demo.env — skipping (public URL will not resolve)"
            exit 0
          fi
          docker network connect "$network" routiq-demo-web 2>/dev/null \
            || echo "already attached to $network"

      # Split from the public check so a failure says whether the app is broken
      # or the reverse proxy is not routing to it yet.
      - name: Smoke test (container)
        run: |
          set -euo pipefail
          for attempt in $(seq 1 10); do
            if curl -fsS --max-time 5 http://127.0.0.1:8080/health; then
              echo "container healthy"
              exit 0
            fi
            echo "attempt $attempt failed, retrying in 5s"
            sleep 5
          done
          echo "::error::web container did not serve /health"
          $COMPOSE ps
          $COMPOSE logs --tail 50 api web
          exit 1

      - name: Smoke test (deep link)
        run: |
          set -euo pipefail
          # A truck URL must load the app shell on a direct visit (#124).
          body=$(curl -fsS --max-time 5 http://127.0.0.1:8080/assets/00000000-0000-4000-8000-000000000000)
          grep -q '<div id="root"' <<<"$body" || { echo "::error::/assets/<id> did not return the app shell"; exit 1; }
          echo "deep link serves the app shell"

      # A missing storage config leaves the app healthy but drops the upload
      # routes, so every receipt photo fails with STORAGE_FAILED. An
      # unauthenticated presign must reach the route (401), not 404, and the
      # bucket path must reach storage itself.
      - name: Smoke test (uploads)
        run: |
          set -euo pipefail
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 -X POST \
            -H 'content-type: application/json' -d '{}' http://127.0.0.1:8080/v1/artifacts/presign)
          [ "$code" = 401 ] || { echo "::error::presign answered $code, not 401 — is S3_ENDPOINT set in /srv/routiq/demo.env?"; exit 1; }
          # Unsigned, so storage itself must refuse it. A 502, a timeout or the
          # app shell all mean uploads are broken.
          storage=$(curl -s -w '\n%{http_code}' --max-time 5 http://127.0.0.1:8080/artifacts/ || true)
          status=${storage##*$'\n'}
          if [ "$status" != 403 ] || ! grep -q '<Code>AccessDenied</Code>' <<<"$storage"; then
            echo "::error::/artifacts/ answered $status without an S3 AccessDenied — storage is not reachable through nginx"; exit 1
          fi
          echo "upload routes and storage proxy reachable"

      # The hostname lives in the box env file, not here: swapping nip.io for a
      # real subdomain is then a box change, not a repo change.
      - name: Smoke test (public URL)
        run: |
          set -euo pipefail
          url=$(grep -E '^PUBLIC_URL=' /srv/routiq/demo.env | cut -d= -f2- || true)
          url=${url:-https://routiq.178.156.253.244.nip.io}
          for attempt in $(seq 1 10); do
            if curl -fsS --max-time 5 "$url/health"; then
              echo "public URL healthy: $url"
              exit 0
            fi
            echo "attempt $attempt failed, retrying in 5s"
            sleep 5
          done
          echo "::error::$url/health unreachable — check the Caddy site block"
          exit 1

      # Never automatic: demo data may be mid-story with a partner (spec §3 step 5).
      - name: Re-seed demo tenant
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.reseed }}
        run: $COMPOSE run --rm api pnpm seed:demo

      # Each build orphans the previous routiq images; without this the box's
      # disk grows every deploy. Dangling-only: Docker refuses to remove an
      # image a container still references, so the box's other project is
      # untouched.
      - name: Prune orphaned build layers
        if: always()
        run: docker image prune -f
