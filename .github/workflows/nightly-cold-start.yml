name: Nightly Cold Start

on:
  schedule:
    - cron: '0 3 * * *'  # 03:00 UTC daily
  workflow_dispatch: {}

jobs:
  cold-start:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start appliance stack
        run: docker compose --profile appliance up -d --build

      - name: Wait for API health
        run: |
          attempt=0
          max_attempts=24
          while [ $attempt -lt $max_attempts ]; do
            if curl -f http://localhost:3001/health; then
              echo "API is healthy"
              exit 0
            fi
            attempt=$((attempt + 1))
            if [ $attempt -lt $max_attempts ]; then
              echo "Health check failed (attempt $attempt/$max_attempts), retrying in 5s..."
              sleep 5
            fi
          done
          echo "API failed to become healthy after $max_attempts attempts"
          exit 1

      # A dropped database connection must not take the API down for good:
      # restart Postgres alone and require the same health gate to pass again.
      - name: Restart Postgres and wait for API health
        run: |
          docker compose --profile appliance restart postgres
          attempt=0
          max_attempts=24
          while [ $attempt -lt $max_attempts ]; do
            if curl -f http://localhost:3001/health; then
              echo "API is healthy"
              # The restart policy would hide a crash; the process itself must survive.
              restarts=$(docker inspect -f '{{.RestartCount}}' "$(docker compose --profile appliance ps -q api)")
              if [ "$restarts" != "0" ]; then
                echo "API container restarted $restarts time(s) during the Postgres restart"
                exit 1
              fi
              exit 0
            fi
            attempt=$((attempt + 1))
            if [ $attempt -lt $max_attempts ]; then
              echo "Health check failed (attempt $attempt/$max_attempts), retrying in 5s..."
              sleep 5
            fi
          done
          echo "API failed to become healthy after $max_attempts attempts"
          exit 1

      - name: Verify storage integration (artifact endpoints registered)
        run: |
          set -euo pipefail
          api_url="http://localhost:3001"
          
          # The artifact endpoints require auth. We test that they return 401
          # (AUTH_REQUIRED) rather than 404 (route not found), proving storage
          # was initialized and the routes are registered.
          echo "Testing presign endpoint is registered..."
          presign_status=$(curl -s -w "%{http_code}" -o /tmp/presign_response.txt \
            -X POST "$api_url/v1/artifacts/presign" \
            -H "Content-Type: application/json" \
            -d '{"artifactId":"test","fileName":"test.bin","sizeBytes":1024}')
          
          presign_body=$(cat /tmp/presign_response.txt)
          
          # 401 means the endpoint exists but auth failed (expected behavior)
          # 404 means the endpoint was not registered (storage not configured)
          if [ "$presign_status" = "401" ]; then
            echo "✓ Presign endpoint is registered (got 401 AUTH_REQUIRED)"
          elif [ "$presign_status" = "404" ]; then
            echo "✗ Presign endpoint not found (404) — storage not configured"
            exit 1
          else
            echo "✗ Unexpected status $presign_status: $presign_body"
            exit 1
          fi
          
          echo "Testing finalize endpoint is registered..."
          finalize_status=$(curl -s -w "%{http_code}" -o /tmp/finalize_response.txt \
            -X POST "$api_url/v1/artifacts/finalize" \
            -H "Content-Type: application/json" \
            -d '{"artifactId":"test","fileName":"test.bin","sizeBytes":1024,"mediaType":"application/octet-stream","checksumSha256":"abc"}')
          
          finalize_body=$(cat /tmp/finalize_response.txt)
          
          if [ "$finalize_status" = "401" ]; then
            echo "✓ Finalize endpoint is registered (got 401 AUTH_REQUIRED)"
          elif [ "$finalize_status" = "404" ]; then
            echo "✗ Finalize endpoint not found (404) — storage not configured"
            exit 1
          else
            echo "✗ Unexpected status $finalize_status: $finalize_body"
            exit 1
          fi
          
          echo "✓ All artifact endpoints are registered"

      # --profile appliance, or compose ignores the api service; -a, or an
      # exited api container is hidden.
      - name: Dump diagnostics on failure
        if: failure()
        run: |
          echo "=== Docker Compose Status ==="
          docker compose --profile appliance ps -a
          echo ""
          echo "=== Docker Compose Logs (last 200 lines) ==="
          docker compose --profile appliance logs --tail 200

      - name: Cleanup
        if: always()
        run: docker compose --profile appliance down -v
