name: Nightly Cold Start

on:
  schedule:
    - cron: '0 3 * * *'  # 03:00 UTC daily
  workflow_dispatch: {}

jobs:
  cold-start:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start appliance stack
        run: docker compose --profile appliance up -d --build

      - name: Wait for API health
        run: |
          attempt=0
          max_attempts=24
          while [ $attempt -lt $max_attempts ]; do
            if curl -f http://localhost:3001/health; then
              echo "API is healthy"
              exit 0
            fi
            attempt=$((attempt + 1))
            if [ $attempt -lt $max_attempts ]; then
              echo "Health check failed (attempt $attempt/$max_attempts), retrying in 5s..."
              sleep 5
            fi
          done
          echo "API failed to become healthy after $max_attempts attempts"
          exit 1

      # A dropped database connection must not take the API down for good:
      # restart Postgres alone and require the same health gate to pass again.
      - name: Restart Postgres and wait for API health
        run: |
          docker compose --profile appliance restart postgres
          attempt=0
          max_attempts=24
          while [ $attempt -lt $max_attempts ]; do
            if curl -f http://localhost:3001/health; then
              echo "API is healthy"
              # The restart policy would hide a crash; the process itself must survive.
              restarts=$(docker inspect -f '{{.RestartCount}}' "$(docker compose --profile appliance ps -q api)")
              if [ "$restarts" != "0" ]; then
                echo "API container restarted $restarts time(s) during the Postgres restart"
                exit 1
              fi
              exit 0
            fi
            attempt=$((attempt + 1))
            if [ $attempt -lt $max_attempts ]; then
              echo "Health check failed (attempt $attempt/$max_attempts), retrying in 5s..."
              sleep 5
            fi
          done
          echo "API failed to become healthy after $max_attempts attempts"
          exit 1

      # A workspace comes from the vendor CLI, as on a real box: the compose
      # file ships no user. The PIN is random per run.
      - name: Provision a workspace with the vendor CLI
        run: |
          set -euo pipefail
          pin="$(openssl rand -hex 8)"
          echo "COLD_START_PIN=$pin" >> "$GITHUB_ENV"
          jq -n --arg pin "$pin" '{
            workspace: { slug: "cold-start", name: "Cold start" },
            branches: [{ code: "CS", name: "Cold start" }],
            admin: { displayName: "Cold start admin", username: "admin", pin: $pin },
            enabledPresets: ["TRUCKING"]
          }' | docker compose --profile appliance exec -T api sh -c 'cat > /tmp/tenant.json'
          docker compose --profile appliance exec -T api pnpm exec tsx scripts/provision.ts --file /tmp/tenant.json

      # #88: the browser uploads straight to storage with a presigned URL, so
      # the URL must name the public endpoint and work from outside the
      # compose network. This runner stands in for the browser.
      - name: Upload a file (login, presign, PUT, finalize, download)
        run: |
          set -euo pipefail
          api="http://localhost:3001"
          public_endpoint="http://localhost:9000"
          work="$(mktemp -d)"

          call() { # method url [json] -> prints the status; body lands in $work/body
            local method="$1" url="$2" data="${3:-}"
            local args=(-sS -o "$work/body" -w '%{http_code}' -X "$method" "$url" -H "Content-Type: application/json")
            if [ -n "${token:-}" ]; then args+=(-H "Authorization: Bearer $token"); fi
            if [ -n "$data" ]; then args+=(--data "$data"); fi
            curl "${args[@]}"
          }
          expect() { # step status wanted
            echo "$1: HTTP $2"
            if [ "$2" != "$3" ]; then echo "expected $3, body:"; cat "$work/body"; echo; exit 1; fi
          }

          status=$(call POST "$api/v1/auth/login" \
            "$(jq -nc --arg pin "$COLD_START_PIN" '{workspaceSlug: "cold-start", username: "admin", pin: $pin}')")
          expect "login" "$status" 200
          token=$(jq -r .token "$work/body")

          # A 1x1 PNG: finalize keeps only files whose bytes sniff as an image or PDF.
          echo 'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg==' \
            | base64 -d > "$work/receipt.png"
          size=$(stat -c %s "$work/receipt.png")
          artifact_id=$(cat /proc/sys/kernel/random/uuid)

          status=$(call POST "$api/v1/artifacts/presign" \
            "$(jq -nc --arg id "$artifact_id" --argjson size "$size" '{artifactId: $id, fileName: "receipt.png", sizeBytes: $size}')")
          expect "presign" "$status" 200
          upload_url=$(jq -r .uploadUrl "$work/body")
          echo "uploadUrl (query stripped): ${upload_url%%\?*}"
          case "$upload_url" in
            "$public_endpoint"/*) ;;
            *) echo "uploadUrl does not point at the public endpoint $public_endpoint"; exit 1 ;;
          esac

          status=$(curl -sS -o "$work/body" -w '%{http_code}' -X PUT "$upload_url" \
            -H "Content-Type: application/octet-stream" --data-binary "@$work/receipt.png")
          expect "PUT to storage" "$status" 200

          status=$(call POST "$api/v1/artifacts/finalize" \
            "$(jq -nc --arg id "$artifact_id" '{artifactId: $id, fileName: "receipt.png"}')")
          expect "finalize" "$status" 200
          echo "finalized artifact:"
          jq . "$work/body"
          jq -e --arg id "$artifact_id" '.id == $id and .mimeType == "image/png"' "$work/body" > /dev/null

          status=$(call GET "$api/v1/artifacts/$artifact_id/download-url")
          expect "download-url" "$status" 200
          download_url=$(jq -r .url "$work/body")
          echo "download url (query stripped): ${download_url%%\?*}"
          status=$(curl -sS -o "$work/downloaded" -w '%{http_code}' "$download_url")
          expect "GET from storage" "$status" 200
          echo "downloaded $(stat -c %s "$work/downloaded") bytes"

          # Informational only: a browser on another origin also needs CORS
          # from storage. Printed so a regression is visible, not gated.
          echo "CORS preflight for PUT from http://localhost:5173:"
          curl -sS -o /dev/null -D - -X OPTIONS "$upload_url" \
            -H "Origin: http://localhost:5173" -H "Access-Control-Request-Method: PUT" \
            -H "Access-Control-Request-Headers: content-type" | grep -i -E '^(HTTP|access-control)' || true

      # --profile appliance, or compose ignores the api service; -a, or an
      # exited api container is hidden.
      - name: Dump diagnostics on failure
        if: failure()
        run: |
          echo "=== Docker Compose Status ==="
          docker compose --profile appliance ps -a
          echo ""
          echo "=== Docker Compose Logs (last 200 lines) ==="
          docker compose --profile appliance logs --tail 200

      - name: Cleanup
        if: always()
        run: docker compose --profile appliance down -v
