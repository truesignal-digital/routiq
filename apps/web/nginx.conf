# Serves the PWA and fronts the API on the same origin, so the browser keeps
# using the relative /v1 paths the app already fetches (mirrors the dev proxy
# in vite.config.ts).
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS. Resolving at request time rather than at startup
    # lets nginx boot while the API is still starting, and picks up the new
    # address after the API container is replaced.
    resolver 127.0.0.11 valid=10s ipv6=off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css text/plain application/javascript application/json image/svg+xml;

    client_max_body_size 25m;

    location /v1 {
        set $api_upstream http://api:3001;
        proxy_pass $api_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location = /health {
        set $api_upstream http://api:3001;
        proxy_pass $api_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Vite emits content-hashed filenames here.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # The app shell must never survive a deploy in a cache.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
